<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Lame Duck — Ellis & Associates</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Barlow:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html,body{width:100%;height:100%;overflow:hidden;background:#87CEEB;touch-action:none}
    canvas{display:block;position:fixed;inset:0;width:100%!important;height:100%!important}
    .screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:20}
    .hidden{display:none!important}
    .bg-blur{background:rgba(10,22,40,0.82);backdrop-filter:blur(6px)}
    .bg-solid{background:#0a1628;overflow-y:auto;justify-content:flex-start}
    #masthead{position:fixed;top:0;left:0;right:0;height:52px;background:rgba(13,27,46,0.88);backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,0.08);display:none;align-items:center;justify-content:space-between;padding:0 16px;z-index:15}
    #masthead.show{display:flex}
    .mast-title{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;color:#fff}
    .mast-title span{color:#5bbcb0;font-style:italic}
    .mast-score-wrap{display:flex;flex-direction:column;align-items:center}
    .mast-score-lbl{font-family:'Barlow',sans-serif;font-size:8px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.35)}
    .mast-score-val{font-family:'Playfair Display',serif;font-size:22px;font-weight:700;color:#fff;line-height:1}
    .mast-close{background:none;border:none;color:rgba(255,255,255,.4);font-size:24px;cursor:pointer;padding:4px 8px;line-height:1;text-decoration:none;font-family:'Barlow',sans-serif}
    .kicker{font-family:'Barlow',sans-serif;font-size:9px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:#5bbcb0;border-left:2px solid #5bbcb0;padding-left:8px;margin-bottom:14px}
    .game-title{font-family:'Playfair Display',serif;font-size:40px;font-weight:700;color:#fff;margin-bottom:4px;text-align:center}
    .game-sub{font-family:'Barlow',sans-serif;font-size:13px;color:rgba(255,255,255,.4);margin-bottom:36px;text-align:center}
    .btn-teal{font-family:'Barlow',sans-serif;font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:15px 44px;background:#5bbcb0;color:#0d1b2e;border:none;cursor:pointer;border-radius:3px}
    .btn-ghost{font-family:'Barlow',sans-serif;font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;padding:11px 28px;background:none;color:rgba(255,255,255,.35);border:1px solid rgba(255,255,255,.15);cursor:pointer;border-radius:3px;margin-top:10px}
    .go-title{font-family:'Playfair Display',serif;font-size:32px;font-weight:700;color:#fff;margin-bottom:10px}
    .go-lbl{font-family:'Barlow',sans-serif;font-size:10px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.35);margin-bottom:4px}
    #go-score{font-family:'Playfair Display',serif;font-size:58px;font-weight:700;color:#5bbcb0;line-height:1;margin-bottom:4px}
    .go-votes{font-family:'Barlow',sans-serif;font-size:10px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,.35);margin-bottom:28px}
    .go-name-lbl{font-family:'Barlow',sans-serif;font-size:12px;color:rgba(255,255,255,.4);margin-bottom:10px}
    #name-input{font-family:'Barlow',sans-serif;font-size:18px;font-weight:600;text-align:center;width:240px;padding:12px 16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.2);color:#fff;outline:none;border-radius:3px;margin-bottom:18px}
    #name-input::placeholder{color:rgba(255,255,255,.2)}
    .btn-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
    #lb-inner{width:100%;max-width:480px;padding:28px 20px 100px}
    .lb-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
    .lb-title{font-family:'Playfair Display',serif;font-size:26px;font-weight:700;color:#fff}
    .lb-x{background:none;border:none;color:rgba(255,255,255,.35);font-size:26px;cursor:pointer;line-height:1;padding:4px}
    .lb-sub{font-family:'Barlow',sans-serif;font-size:11px;color:rgba(255,255,255,.25);margin-bottom:20px}
    .lb-row{display:grid;grid-template-columns:28px 1fr auto;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid rgba(255,255,255,.06)}
    .lb-rank{font-family:'Barlow',sans-serif;font-size:12px;color:rgba(255,255,255,.2)}
    .lb-name-col{display:flex;flex-direction:column;gap:2px}
    .lb-name{font-family:'Barlow',sans-serif;font-size:15px;font-weight:600;color:#fff}
    .lb-name.gold{color:#5bbcb0}
    .lb-date{font-family:'Barlow',sans-serif;font-size:11px;color:rgba(255,255,255,.2)}
    .lb-score{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;color:rgba(255,255,255,.6)}
    .lb-score.gold{color:#5bbcb0}
    .lb-foot{position:fixed;bottom:0;left:0;right:0;padding:14px 20px;background:#0a1628;border-top:1px solid rgba(255,255,255,.06)}
    .lb-foot button{width:100%;font-family:'Barlow',sans-serif;font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:14px;background:#5bbcb0;color:#0d1b2e;border:none;cursor:pointer;border-radius:3px}
    #desktop-block{position:fixed;inset:0;background:#0d1b2e;z-index:999;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px}
    .db-e{font-size:48px;margin-bottom:16px}
    .db-t{font-family:'Playfair Display',serif;font-size:28px;font-weight:700;color:#fff;margin-bottom:8px}
    .db-s{font-family:'Barlow',sans-serif;font-size:14px;color:rgba(255,255,255,.4);margin-bottom:28px}
  </style>
</head>
<body>

  <div id="desktop-block">
    <div class="db-e">🦆</div>
    <div class="db-t">Mobile Only</div>
    <div class="db-s">Lame Duck is a mobile-only game.<br>Open it on your phone.</div>
    <a href="/" style="font-family:'Barlow',sans-serif;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:12px 28px;background:#5bbcb0;color:#0d1b2e;text-decoration:none;border-radius:3px;">Back to Site</a>
  </div>

  <canvas id="canvas"></canvas>

  <div id="masthead">
    <div class="mast-title">Lame <span>Duck</span></div>
    <div class="mast-score-wrap">
      <div class="mast-score-lbl">Votes Secured</div>
      <div class="mast-score-val" id="mast-score">0</div>
    </div>
    <a href="/" class="mast-close">×</a>
  </div>

  <div id="start-screen" class="screen bg-blur">
    <div class="kicker">Session Adjourned</div>
    <div class="game-title">Lame Duck</div>
    <div class="game-sub">Get through. Get it passed.</div>
    <button class="btn-teal" onclick="startGame()">Tap to Play</button>
    <button class="btn-ghost" onclick="showLeaderboard()">Leaderboard</button>
  </div>

  <div id="go-screen" class="screen bg-blur hidden">
    <div class="go-title">Game Over</div>
    <div class="go-lbl">You Secured</div>
    <div id="go-score">0</div>
    <div class="go-votes">Votes</div>
    <div class="go-name-lbl">Enter your name for the leaderboard</div>
    <input id="name-input" maxlength="30" placeholder="Your name" autocomplete="off" autocorrect="off" spellcheck="false" />
    <div class="btn-row">
      <button class="btn-teal" onclick="submitScore()">Submit</button>
      <button class="btn-ghost" style="margin-top:0" onclick="showLeaderboard()">Leaderboard</button>
      <button class="btn-ghost" style="margin-top:0" onclick="startGame()">Play Again</button>
    </div>
  </div>

  <div id="lb-screen" class="screen bg-solid hidden">
    <div id="lb-inner">
      <div class="lb-hdr">
        <div class="lb-title">Top Lobbyists</div>
        <button class="lb-x" onclick="hideLeaderboard()">×</button>
      </div>
      <div class="lb-sub">Global leaderboard · All time</div>
      <div id="lb-list"></div>
    </div>
    <div class="lb-foot"><button onclick="startGame()">Play Again</button></div>
  </div>

  <script>
    const isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || navigator.maxTouchPoints > 1;
    if (!isMobile) {
      document.getElementById('desktop-block').style.display = 'flex';
      document.getElementById('start-screen').classList.add('hidden');
    }

    const BIN_URL = 'https://api.jsonbin.io/v3/b/6a0b797bee5a733b12debe9d';
    const BIN_KEY = '$2a$10$nlhbyVrq0IdFG8SVJyrcOOy6DyVHVlnMBAWrP.6WGi0/L3Sw7ZCQS';

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let W, H, DPR;

    function resize() {
      DPR = window.devicePixelRatio || 1;
      W = window.innerWidth;
      H = window.innerHeight;
      canvas.width  = W * DPR;
      canvas.height = H * DPR;
      canvas.style.width  = W + 'px';
      canvas.style.height = H + 'px';
      ctx.scale(DPR, DPR);
    }
    resize();
    window.addEventListener('resize', () => {
      resize();
      if (state==='start') drawStatic();
    });

    // Assets
    const imgs = {};
    let loaded = 0;
    const SRCS = {
      duck:     'assets/duck-alive.png',
      duckDead: 'assets/duck-dead.png',
      bill:     'assets/bill-stack.png',
      bg:       'assets/capitol-bg.png',
      ground:   'assets/ground-strip.png'
    };
    for (const [k,src] of Object.entries(SRCS)) {
      imgs[k] = new Image();
      imgs[k].onload = imgs[k].onerror = () => { if (++loaded >= 5 && state==='start') drawStatic(); };
      imgs[k].src = src;
    }

    // ── CONSTANTS ─────────────────────────────────────────────────────────────
    const MASTHEAD_H = 52;
    const GH         = 60;   // ground strip height
    const DW         = 60;   // duck width
    const DH         = 44;   // duck height
    const PW         = 64;   // pipe width
    const PGAP       = 200;  // vertical gap between pipes
    const PSPEED     = 2.2;  // horizontal scroll speed
    const PSPACE     = 270;  // horizontal spacing between pipe pairs
    const GRAV       = 0.40;
    const FLAP       = -7.8;
    const VMAX       = 9;
    const VMIN       = -8;

    // ── STATE ─────────────────────────────────────────────────────────────────
    let state = 'start', raf = null;
    let dx, dy, dvy, dangle;
    let pipes, nextIn;
    let score = 0, best = parseInt(localStorage.getItem('ld_best')||'0'), deadTimer = 0;

    // Precompute bill pattern once assets load
    let billPattern = null;
    function makeBillPattern() {
      if (!imgs.bill || !imgs.bill.complete || !imgs.bill.naturalWidth) return;
      // Create offscreen canvas with bill image scaled to pipe width
      const bh = Math.round(PW * (imgs.bill.naturalHeight / imgs.bill.naturalWidth));
      const oc = document.createElement('canvas');
      oc.width = PW; oc.height = bh;
      const oc2 = oc.getContext('2d');
      oc2.drawImage(imgs.bill, 0, 0, PW, bh);
      billPattern = ctx.createPattern(oc, 'repeat-y');
    }

    // ── SCREENS ───────────────────────────────────────────────────────────────
    function show(id) {
      ['start-screen','go-screen','lb-screen'].forEach(s =>
        document.getElementById(s).classList.toggle('hidden', s !== id));
    }
    function hideAll() {
      ['start-screen','go-screen','lb-screen'].forEach(s =>
        document.getElementById(s).classList.add('hidden'));
    }

    // ── GAME LOOP ─────────────────────────────────────────────────────────────
    function reset() {
      dx = W * 0.22; dy = H * 0.45; dvy = 0; dangle = 0;
      pipes = []; nextIn = W + 80; score = 0; deadTimer = 0;
      document.getElementById('mast-score').textContent = '0';
    }

    function startGame() {
      reset(); state = 'playing'; hideAll();
      document.getElementById('masthead').classList.add('show');
      if (raf) cancelAnimationFrame(raf);
      raf = requestAnimationFrame(loop);
    }

    function loop() {
      update(); draw();
      if (state === 'dead' && deadTimer >= 55) { showGameOver(); return; }
      raf = requestAnimationFrame(loop);
    }

    function update() {
      if (state === 'dead') {
        deadTimer++; dvy = Math.min(dvy + GRAV, VMAX); dy += dvy;
        dangle = Math.min(dangle + 4, 90); return;
      }
      if (state !== 'playing') return;

      dvy = Math.max(VMIN, Math.min(dvy + GRAV, VMAX));
      dy += dvy;
      dangle = Math.max(-22, Math.min(72, dvy * 4));

      nextIn -= PSPEED;
      if (nextIn <= 0) {
        const playH = H - MASTHEAD_H - GH;
        const minT  = MASTHEAD_H + playH * 0.08;
        const maxT  = H - GH - PGAP - playH * 0.08;
        pipes.push({ x: W + PW + 10, topH: minT + Math.random() * (maxT - minT), passed: false });
        nextIn = PSPACE;
      }
      for (const p of pipes) {
        p.x -= PSPEED;
        if (!p.passed && p.x + PW < dx) {
          p.passed = true; score++;
          document.getElementById('mast-score').textContent = score;
        }
      }
      pipes = pipes.filter(p => p.x + PW > -30);

      // Collision — inset hitbox
      const PAD = 10;
      const L = dx - DW/2 + PAD, R = dx + DW/2 - PAD;
      const T = dy - DH/2 + PAD, B = dy + DH/2 - PAD;
      if (B >= H - GH || T <= MASTHEAD_H) { die(); return; }
      for (const p of pipes) {
        if (R <= p.x + 3 || L >= p.x + PW - 3) continue;
        if (T < p.topH || B > p.topH + PGAP) { die(); return; }
      }
    }

    function die() {
      if (state === 'dead') return;
      state = 'dead'; deadTimer = 0;
      if (score > best) { best = score; localStorage.setItem('ld_best', score); }
      document.getElementById('masthead').classList.remove('show');
    }

    function showGameOver() {
      document.getElementById('go-score').textContent = score;
      document.getElementById('name-input').value = '';
      show('go-screen');
    }

    // ── DRAW ──────────────────────────────────────────────────────────────────
    function drawBackground() {
      const bg = imgs.bg;
      const skyH = H - GH;
      ctx.fillStyle = '#87CEEB';
      ctx.fillRect(0, 0, W, skyH);
      if (bg && bg.complete && bg.naturalWidth) {
        // Cover — scale to whichever gives full coverage
        const scaleW = W / bg.naturalWidth;
        const scaleH = skyH / bg.naturalHeight;
        const scale  = Math.max(scaleW, scaleH);
        const drawW  = bg.naturalWidth  * scale;
        const drawH  = bg.naturalHeight * scale;
        const drawX  = (W - drawW) / 2;
        const drawY  = (skyH - drawH) / 2;
        ctx.drawImage(bg, drawX, drawY, drawW, drawH);
      }
    }

    function drawGround() {
      const gnd = imgs.ground;
      const gY = H - GH;
      ctx.fillStyle = '#5a8a3c';
      ctx.fillRect(0, gY, W, GH);
      if (gnd && gnd.complete && gnd.naturalWidth) {
        const gW = GH * (gnd.naturalWidth / gnd.naturalHeight);
        for (let gx = 0; gx < W; gx += gW) {
          ctx.drawImage(gnd, gx, gY, Math.min(gW, W - gx), GH);
        }
      }
    }

    function drawPipes() {
      const bill = imgs.bill;
      const PIPE_BASE = '#d4c9a8'; // cream base matching bill scroll color

      for (const p of pipes) {
        const botY = p.topH + PGAP;
        const topH = p.topH;
        const botH = H - GH - botY;

        // ── Bottom pipe ──
        // 1. Solid base fill
        ctx.fillStyle = PIPE_BASE;
        ctx.fillRect(p.x, botY, PW, botH);
        // 2. Tile bill image
        if (bill && bill.complete && bill.naturalWidth) {
          const bh = Math.round(PW * bill.naturalHeight / bill.naturalWidth);
          for (let y = botY; y < H - GH; y += bh) {
            const drawH = Math.min(bh, H - GH - y);
            ctx.drawImage(bill, 0, 0, bill.naturalWidth, bill.naturalHeight, p.x, y, PW, drawH);
          }
        }

        // ── Top pipe (draw bill right-side up from gap opening upward) ──
        ctx.fillStyle = PIPE_BASE;
        ctx.fillRect(p.x, 0, PW, topH);
        if (bill && bill.complete && bill.naturalWidth) {
          const bh = Math.round(PW * bill.naturalHeight / bill.naturalWidth);
          // Start from gap end, tile upward
          for (let y = topH - bh; y > -bh; y -= bh) {
            const srcY0 = y < 0 ? -y : 0;
            const dstY  = y < 0 ? 0  : y;
            const drawH = y < 0 ? bh - srcY0 : bh;
            const srcH  = drawH * (bill.naturalHeight / bh);
            ctx.drawImage(bill, 0, srcY0 * (bill.naturalHeight / bh), bill.naturalWidth, srcH, p.x, dstY, PW, drawH);
          }
        }

        // Subtle edge shadow for depth
        ctx.fillStyle = 'rgba(0,0,0,0.10)';
        ctx.fillRect(p.x + PW - 4, 0, 4, topH);
        ctx.fillRect(p.x + PW - 4, botY, 4, botH);
        ctx.fillRect(p.x, 0, 4, topH);
        ctx.fillRect(p.x, botY, 4, botH);
      }
    }

    function drawDuck() {
      const dImg = state === 'dead' ? imgs.duckDead : imgs.duck;
      ctx.save();
      ctx.translate(dx, dy);
      ctx.rotate(dangle * Math.PI / 180);
      if (dImg && dImg.complete && dImg.naturalWidth) {
        ctx.drawImage(dImg, -DW/2, -DH/2, DW, DH);
      } else {
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.ellipse(0,0,DW/2,DH/2,0,0,Math.PI*2); ctx.fill();
      }
      ctx.restore();
    }

    function drawStatic() {
      ctx.clearRect(0, 0, W, H);
      drawBackground();
      drawGround();
    }

    function draw() {
      ctx.clearRect(0, 0, W, H);
      drawBackground();
      drawPipes();
      drawGround();
      drawDuck();
    }

    // ── INPUT ─────────────────────────────────────────────────────────────────
    function flap(e) {
      if (state !== 'playing') return;
      e.preventDefault(); dvy = FLAP;
    }
    canvas.addEventListener('touchstart', flap, { passive: false });
    canvas.addEventListener('mousedown', flap);

    // ── LEADERBOARD ───────────────────────────────────────────────────────────
    function showLeaderboard() { show('lb-screen'); loadLeaderboard(); }
    function hideLeaderboard() { show('start-screen'); }

    async function submitScore() {
      const name = document.getElementById('name-input').value.trim() || 'Anonymous';
      try {
        const res  = await fetch(BIN_URL+'/latest', { headers:{'X-Master-Key':BIN_KEY,'X-Bin-Meta':'false'} });
        const data = await res.json();
        const scores = data.scores || [];
        scores.push({ name, score, date: new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) });
        scores.sort((a,b) => b.score - a.score);
        await fetch(BIN_URL, {
          method:'PUT',
          headers:{'Content-Type':'application/json','X-Master-Key':BIN_KEY,'X-Bin-Versioning':'false'},
          body: JSON.stringify({ scores: scores.slice(0,20) })
        });
      } catch(e) { console.error(e); }
      showLeaderboard();
    }

    async function loadLeaderboard() {
      const el = document.getElementById('lb-list');
      el.innerHTML = '<div style="font-family:Barlow,sans-serif;font-size:13px;color:rgba(255,255,255,.3);padding:24px 0">Loading...</div>';
      try {
        const res  = await fetch(BIN_URL+'/latest', { headers:{'X-Master-Key':BIN_KEY,'X-Bin-Meta':'false'} });
        const data = await res.json();
        const scores = data.scores || [];
        if (!scores.length) {
          el.innerHTML = '<div style="font-family:Barlow,sans-serif;font-size:13px;color:rgba(255,255,255,.3);padding:24px 0">No scores yet. Be the first!</div>';
          return;
        }
        el.innerHTML = scores.map((s,i) => `
          <div class="lb-row">
            <span class="lb-rank">${i+1}</span>
            <div class="lb-name-col">
              <span class="lb-name${i===0?' gold':''}">${s.name||s.initials||'?'}</span>
              <span class="lb-date">${s.date||''}</span>
            </div>
            <span class="lb-score${i===0?' gold':''}">${s.score}</span>
          </div>`).join('');
      } catch(e) {
        el.innerHTML = '<div style="font-family:Barlow,sans-serif;font-size:13px;color:rgba(255,255,255,.3);padding:24px 0">Unable to load scores.</div>';
      }
    }

    drawStatic();
  </script>
</body>
</html>
